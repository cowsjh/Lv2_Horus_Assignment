# lv2_module5/config/device.yaml
# 측정일: 2026-10-06 · 방법: firmware/tools/dxl_check (토크 off, 손으로 회전)
# safe 범위 = 측정 끝값에서 100 tick(약 8.8°) 안쪽
# 각도 변환: rad = (tick - center_tick) × 2π / 4096   (1 tick ≈ 0.088°)
# 부호: pan + = 왼쪽, tilt + = 위쪽 (모터 tick 증가 방향 그대로)
/**:
  ros__parameters:
    serial_port: /dev/ttyACM0
    dxl_protocol: 2.0
    dxl_baud: 1000000
    dxl_model: 1020              # XM430-W350
    pan:
      id: 11
      center_tick: 2046          # 기본 자세 (정면)
      measured_min_tick: 598     # 오른쪽 끝
      measured_max_tick: 3602    # 왼쪽 끝
      safe_min_tick: 698
      safe_max_tick: 3502
    tilt:
      id: 12
      center_tick: 2553          # 기본 자세
      measured_min_tick: 1833    # 아래쪽 끝
      measured_max_tick: 2911    # 위쪽(뒤) 끝
      safe_min_tick: 1933
      safe_max_tick: 2811
